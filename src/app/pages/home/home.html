<section class="agenda-page">
  <!-- BARRA SUPERIOR (Toolbar, Navegación de Fechas y Vistas) -->
  <div class="agenda-toolbar">
    <div>
      <h1>{{ periodLabel | titlecase }}</h1>
      <span class="current-time">Hora actual: {{ currentTime }}</span>
    </div>

    <div class="date-controls">
      <button type="button" aria-label="Periodo anterior" (click)="moveDate(-1)">‹</button>
      <button type="button" (click)="goToToday()">Hoy</button>
      <button type="button" aria-label="Periodo siguiente" (click)="moveDate(1)">›</button>
    </div>

    <div class="view-selector" role="group" aria-label="Vista del calendario">
      <button type="button" [class.active]="viewMode === 'day'" (click)="selectView('day')">
        Día
      </button>
      <button type="button" [class.active]="viewMode === 'week'" (click)="selectView('week')">
        Semana
      </button>
    </div>

    <!-- Si tienes un servicio para abrir la creación por botón, o puedes omitirlo si prefieres -->
    <button type="button" class="create-button" (click)="calendarComponent?.getApi()?.today()">
      <mat-icon>event_available</mat-icon>
      Ir a hoy
    </button>
  </div>

  <!-- BARRA DE BÚSQUEDA Y FILTRO DE FECHAS -->
  <div class="agenda-tools">
    <label class="search-field">
      <mat-icon>search</mat-icon>
      <input [(ngModel)]="searchTerm" type="search" placeholder="Buscar cliente o servicio" />
    </label>
    <input 
      [(ngModel)]="selectedDate" 
      (change)="loadAgenda()" 
      type="date" 
      class="date-picker" 
    />
  </div>

  <!-- PANEL DEL CALENDARIO (FullCalendar) -->
  <section class="calendar-panel" aria-label="Agenda FullCalendar">
    <div class="calendar-heading">
      <div>
        <h2>
          {{
            viewMode === 'day'
              ? 'Agenda del día'
              : 'Agenda semanal'
          }}
        </h2>
      </div>
    </div>

    <!-- Contenedor donde se monta FullCalendar de forma nativa -->
    <div class="calendar-container">
      <full-calendar #calendar [options]="calendarOptions"></full-calendar>
    </div>
  </section>
</section>
