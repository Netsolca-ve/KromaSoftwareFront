<section class="module-page">
  <header class="module-heading">
    <div>
      <p class="eyebrow">ATENCIÓN EN EL LOCAL</p>
      <h1>Walk ins</h1>
      <p>Registra y organiza las citas de clientes que llegan sin reserva.</p>
    </div>
    <strong class="count-badge">0 clientes en espera</strong>
  </header>

  <div class="entry-form">
    <button type="button" (click)="abrirModalCita()">
      <mat-icon>person_add</mat-icon>
      Registrar cliente sin cita
    </button>
  </div>

  <div class="list-card">
    <p class="empty-state">No hay clientes esperando.</p>
  </div>
</section>
