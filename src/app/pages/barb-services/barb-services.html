<section class="module-page">
  <header class="module-heading">
    <div>
      <h1>Servicios</h1>
    </div>
  </header>

  <form class="entry-form" [formGroup]="serviciosForm" (ngSubmit)="onSubmit()">
    <input formControlName="nombre" placeholder="Nombre del servicio" />
    <input formControlName="precio" type="number" min="0" step="0.01" placeholder="Precio en USDT" />
    <button type="submit" [disabled]="serviciosForm.invalid">
      <mat-icon>add</mat-icon>Agregar servicio
    </button>
  </form>

  <div class="catalog-grid">
    @for (servicio of serviciosService.listaServicios(); track servicio.id) {
      <article class="catalog-card">
        <div class="round-icon"><mat-icon>content_cut</mat-icon></div>
        <div>
          <strong>{{ servicio.nombre }}</strong>
          <small>{{ servicio.precio }} USDT</small>
        </div>
      </article>
    } @empty {
      <p class="empty-state">No hay servicios registrados en el sistema.</p>
    }
  </div>
</section>
