<section class="module-page">
  <header class="module-heading">
    <div>
      <h1>Empleados</h1>
    </div>
    <strong class="count-badge">{{ empleadosService.listaEmpleados().length }} barberos</strong>
  </header>

  <form class="entry-form" [formGroup]="empleadoForm" (ngSubmit)="onSubmit()">
    <input formControlName="nombre" placeholder="Nombre del barbero" />
    <button type="submit" [disabled]="empleadoForm.invalid">
      <mat-icon>person_add</mat-icon>Agregar empleado
    </button>
  </form>

  <div class="employee-grid">
    @for (empleado of empleadosService.listaEmpleados(); track empleado.id) {
      <article class="employee-card">
        <div class="employee-avatar">
          {{ obtenerInicial(empleado.nombre) }}
        </div>

        <div class="employee-info">
          <strong>{{ empleado.nombre }}</strong>
          <small>{{ empleado.cargo }}</small>
        </div>

        <button type="button">Activo</button>
      </article>
    } @empty {
      <p class="empty-state">Aún no hay barberos registrados. Agrega el primero arriba.</p>
    }
  </div>
</section>
