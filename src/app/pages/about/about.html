<section class="module-page">
  <header class="module-heading">
    <div>
      <h1>Empleados</h1>
    </div>
    <strong class="count-badge">{{ employees.length }} barberos</strong>
  </header>
  <form class="entry-form" (ngSubmit)="addEmployee()">
    <input [(ngModel)]="name" name="name" placeholder="Nombre del barbero" required />
    <button type="submit"><mat-icon>person_add</mat-icon>Agregar empleado</button>
  </form>
  <div class="employee-grid">
    @for (employee of employees; track employee.name) {
    <article class="employee-card">
      <div class="employee-avatar">{{ employee.name.charAt(0) }}</div>
      <div class="employee-info">
        <strong>{{ employee.name }}</strong>
        <small>{{ employee.role }}</small>
      </div>
      <button type="button" [class.inactive]="!employee.active" (click)="toggleEmployee(employee)">
        {{ employee.active ? 'Activo' : 'Inactivo' }}
      </button>
    </article>
    }
  </div>
</section>
