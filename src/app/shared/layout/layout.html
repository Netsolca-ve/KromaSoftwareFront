<div class="app-layout" [class.dark-mode]="isDarkMode">
  <aside class="sidebar">
    
    <div class="brand">KROMA SOFTWARE</div>
    
    
    <nav class="navigation">
      <a routerLink="/home" routerLinkActive="active">
        <mat-icon>calendar_month</mat-icon>
        <span>Agenda</span>
      </a>
      
      <a routerLink="/walk-ins">
        <mat-icon>group</mat-icon>
        <span>Walk ins</span>
      </a>

      <a routerLink="/payments">
        <mat-icon>point_of_sale</mat-icon>
        <span>Cobros</span>
      </a>

      <a routerLink="/barb-services">
        <mat-icon>content_cut</mat-icon>
        <span>Servicios</span>
      </a>

      <a routerLink="/client">
        <mat-icon>person</mat-icon>
        <span>Clientes</span>
      </a>

      <a routerLink="/about">
        <mat-icon>person</mat-icon>
        <span>Empleados</span>
      </a>

      <a routerLink="/register">
        <mat-icon>ballot</mat-icon>
        <span>Resgitro de usuarios</span>
      </a>
    </nav>

    <div class="sidebar-bottom">
      <div class="mode-selector">
        <span>MODO</span>
        <button
          type="button"
          aria-label="Activar modo claro"
          [attr.aria-pressed]="!isDarkMode"
          [class.selected]="!isDarkMode"
          (click)="setTheme(false)"
        >
          <mat-icon>light_mode</mat-icon>
        </button>
        <button
          type="button"
          aria-label="Activar modo oscuro"
          [attr.aria-pressed]="isDarkMode"
          [class.selected]="isDarkMode"
          (click)="setTheme(true)"
        >
          <mat-icon>dark_mode</mat-icon>
        </button>
      </div>

      <div class="user-profile">
        <div class="avatar">
          <mat-icon>person</mat-icon>
        </div>

        <div>
          <h2>Hola, {{ Auth.currentUser()?.nombre || 'Usuario' }}</h2>
          <small>{{ Auth.currentUser()?.rol || 'Sin rol' }}</small>
        </div>
      </div>
    </div>
  </aside>

  <div class="main-area">
    <header class="topbar">
      <div class="search-box">
        <mat-icon>search</mat-icon>

        <input
          type="search"
          placeholder="Buscar cita..."
        />
      </div>

      

      <button
        class="profile-button"
        type="button"
        aria-label="Abrir perfil"
        [attr.aria-expanded]="showProfile"
        (click)="toggleProfile()"
      >
        <mat-icon>account_circle</mat-icon>
      </button>
    </header>

    <main class="page-content">
    <router-outlet></router-outlet>
  </main>
  </div>
</div>

@if (showProfile) {
  <div class="profile-modal-backdrop" (click)="closeProfile()">
    <section
      class="profile-modal"
      role="dialog"
      aria-modal="true"
      aria-label="Perfil de usuario"
      (click)="$event.stopPropagation()"
    >
      <button
        class="modal-close"
        type="button"
        aria-label="Cerrar perfil"
        (click)="closeProfile()"
      >
        <mat-icon>close</mat-icon>
      </button>

      <app-userlayout></app-userlayout>
    </section>
  </div>
}
