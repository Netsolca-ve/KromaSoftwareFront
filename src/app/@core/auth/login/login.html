<main class="login-page">
  <header class="topbar"></header>

  <section class="login-content">
    <div class="brand-mark">✂</div>

    <div class="brand-name">KROMA SOFTWARE</div>

  
    <div class="subtitle">Inicia sesión para acceder a tu cuenta</div>

    <form class="login-card" (ngSubmit)="login()">
          <h1>Iniciar Sesión</h1>
      <div class="branch-heading"></div>

      <label for="email">CORREO ELECTRÓNICO</label>
      <input
        id="email"
        name="email"
        type="email"
        placeholder="admin@noblecut.com"
        [(ngModel)]="email"
      />

      <div class="password-heading">
        <label for="password">CONTRASEÑA</label>
      </div>

      <div class="password-field">
        <input
          id="password"
          name="password"
          [type]="showPassword ? 'text' : 'password'"
          placeholder="••••••••"
          [(ngModel)]="password"
        />

        <button type="button" class="show-password" (click)="showPassword = !showPassword">
          <mat-icon>
            {{ showPassword ? 'visibility_off' : 'visibility' }}
          </mat-icon>
        </button>
      </div>

      <label class="remember">
        <input type="checkbox" />
        <span>Recordar sesión en este equipo</span>
      </label>

      @if (errorMessage) {
        <p class="error-message">{{ errorMessage }}</p>
      }

      <button class="submit-button" type="submit">Entrar al Panel <span>→</span></button>

      <div class="forgot-password">
        <a href="#">¿Olvidaste tu contraseña?</a>
      </div>
    </form>

  </section>
</main>
